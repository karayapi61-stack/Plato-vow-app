header><div id="content"></div></main></div><nav class="bottomnav" id="bottomNav"></nav><div id="modalRoot"></div><div id="toastRoot"></div><script>
const TYPES=['Plato kullanımı','Bride organizasyonu','Evlilik teklifi','Doğum günü','Çekim paketleri','Workshop'];
const STATUSES=['Ön rezervasyon','Kapora alındı','Kesinleşti','Tamamlandı','İptal'];
const NAV=[['home','⌂','Ana Sayfa'],['calendar','▦','Takvim'],['bookings','▤','Rezervasyonlar'],['cafe','☕','VOW Kafe'],['reports','▥','Raporlar'],['settings','⚙','Ayarlar']];
const KEY='plato_vow_demo_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{reservations:[],cafe:[],expenses:[]}}catch(e){db={reservations:[],cafe:[],expenses:[]}};
for(let k of ['reservations','cafe','expenses'])db[k]??=[];
let view='home',month=new Date(),selectedDate=localDate(new Date());
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function money(n){return Number(n||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Depolama dolu veya kapalı. Verileri dışa aktarın.')}}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}
function balance(r){return Math.max(0,Number(r.total||0)-Number(r.deposit||0)-Number(r.paid||0))}
function totalPaid(r){return Number(r.deposit||0)+Number(r.paid||0)}
function toast(s){document.getElementById('toastRoot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2500)}
function nav(){let mk=(bottom)=>NAV.map(([id,ic,label])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${bottom?'<span>'+ic+'</span>':ic+' &nbsp;'}${label}</button>`).join('');document.getElementById('sideNav').innerHTML=mk(false);document.getElementById('bottomNav').innerHTML=mk(true)}
function go(v){view=v;nav();document.getElementById('pageTitle').textContent=({home:'Genel Bakış',calendar:'Rezervasyon Takvimi',bookings:'Rezervasyonlar',cafe:'VOW Kafe',reports:'Gelir & Raporlar',settings:'Ayarlar'})[v];render()}
function render(){const el=document.getElementById('content');el.innerHTML=({home:home,calendar:calendar,bookings:bookings,cafe:cafe,reports:reports,settings:settings})[view]();}
function dateTR(d){return new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}
function card(icon,label,value){return `<div class="card"><div class="ico">${icon}</div><div class="muted">${label}</div><div class="num">${value}</div></div>`}
function active(r){return r.status!=='İptal'}
function home(){let today=localDate(new Date()),rs=db.reservations.filter(r=>r.date===today&&active(r)),receipts=db.reservations.filter(active).reduce((s,r)=>s+(r.payments||[]).filter(p=>p.date===today).reduce((a,p)=>a+Number(p.amount),0),0),caf=db.cafe.filter(x=>x.date===today).reduce((s,x)=>s+Number(x.cash||0)+Number(x.card||0)+Number(x.transfer||0),0),out=db.reservations.filter(active).reduce((s,r)=>s+balance(r),0);return `<div class="cards">${card('▦','Bugünkü organizasyon',rs.length)}${card('₺','Bugünkü tahsilat',money(receipts))}${card('☕','Bugünkü kafe cirosu',money(caf))}${card('◷','Bekleyen bakiye',money(out))}</div><div class="two"><div class="panel"><h2>Bugünkü rezervasyonlar</h2>${reservationTable(rs.sort((a,b)=>a.start.localeCompare(b.start)),true)}</div><div class="panel"><h2>Hızlı işlemler</h2><div class="toolbar"><button class="btn" onclick="openReservation()">＋ Yeni rezervasyon</button><button class="btn secondary" onclick="go('cafe')">☕ Kafe cirosu ekle</button><button class="btn secondary" onclick="go('calendar')">▦ Takvimi aç</button></div><div class="notice">💡 Aynı saatte birden fazla organizasyon kaydedilebilir. Alan ve süsleme detaylarını açıklama kısmına yazın.</div><h2>Yaklaşan rezervasyonlar</h2>${db.reservations.filter(r=>active(r)&&r.date>=today).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,5).map(r=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(r.name)}</b><div class="muted">${dateTR(r.date)} • ${esc(r.start)} • ${esc(r.type)}</div></div>`).join('')||'<div class="empty">Henüz yaklaşan kayıt yok.</div>'}</div></div>`}
function reservationTable(rows,compact=false){if(!rows.length)return '<div class="empty">Henüz rezervasyon bulunmuyor.</div>';return `<div class="tablewrap"><table><thead><tr><th>Müşteri</th><th>Tarih / Saat</th><th>Organizasyon</th>${compact?'':'<th>Kalan</th>'}<th>İşlem</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.phone)}</span></td><td>${dateTR(r.date)}<br><span class="muted">${esc(r.start)}–${esc(r.end)}</span></td><td><span class="tag">${esc(r.type)}</span><br><span class="muted">${esc(r.status)}</span></td>${compact?'':`<td>${money(balance(r))}</td>`}<td><button class="btn secondary sm" onclick="showReservation('${r.id}')">Detay</button></td></tr>`).join('')}</tbody></table></div>`}
function bookings(){return `<div class="panel"><div class="toolbar"><input id="search" placeholder="İsim veya telefon ara" oninput="filterBookings()"><select id="typeFilter" onchange="filterBookings()"><option value="">Tüm organizasyonlar</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select><select id="statusFilter" onchange="filterBookings()"><option value="">Tüm durumlar</option>${STATUSES.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="bookingsList">${reservationTable([...db.reservations].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)))}</div></div>`}
function filterBookings(){let q=document.getElementById('search').value.toLocaleLowerCase('tr-TR'),t=document.getElementById('typeFilter').value,s=document.getElementById('statusFilter').value;document.getElementById('bookingsList').innerHTML=reservationTable(db.reservations.filter(r=>(r.name+' '+r.phone).toLocaleLowerCase('tr-TR').includes(q)&&(!t||r.type===t)&&(!s||r.status===s)).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)))}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<42;i++){let d=new Date(y,m,1-offset+i),key=localDate(d),rs=db.reservations.filter(r=>r.date===key&&active(r));cells+=`<div class="day ${d.getMonth()!==m?'other':''} ${key===localDate(new Date())?'today':''} ${key===selectedDate?'selected':''}" onclick="pickDate('${key}')"><strong>${d.getDate()}</strong>${rs.slice(0,3).map(r=>`<div class="event" role="button" tabindex="0" title="Rezervasyon detayını aç" onclick="event.stopPropagation();showReservation('${r.id}')" onkeydown="if(event.key==='Enter'){event.stopPropagation();showReservation('${r.id}')}">${esc(r.start)} ${esc(r.name)}</div>`).join('')}${rs.length>3?`<div class="muted" style="font-size:10px">+${rs.length-3} diğer</div>`:''}</div>`}let selected=db.reservations.filter(r=>r.date===selectedDate&&active(r)).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="panel"><div class="cal-head"><button class="btn secondary sm" onclick="moveMonth(-1)">‹ Önceki</button><b>${month.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</b><button class="btn secondary sm" onclick="moveMonth(1)">Sonraki ›</button></div><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div><div class="panel"><div class="cal-head"><h2 style="margin:0">${dateTR(selectedDate)} • ${selected.length} rezervasyon</h2><button class="btn sm" onclick="openReservation(null,'${selectedDate}')">＋ Ekle</button></div>${reservationTable(selected)}</div>`}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function pickDate(s){selectedDate=s;month=new Date(s+'T12:00:00');render()}
function openReservation(id=null,dt=null){let r=id?db.reservations.find(x=>x.id===id):null;r=r||{name:'',phone:'',type:TYPES[0],date:dt||selectedDate,start:'14:00',end:'15:00',total:0,deposit:0,paid:0,status:'Ön rezervasyon',notes:''};let content=`<form id="reservationForm" onsubmit="saveReservation(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Ad soyad *</label><input name="name" required value="${esc(r.name)}"></div><div class="field"><label>Telefon *</label><input name="phone" type="tel" required value="${esc(r.phone)}" placeholder="05XX XXX XX XX"></div><div class="field"><label>Organizasyon türü</label><select name="type">${TYPES.map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Durum</label><select name="status">${STATUSES.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tarih *</label><input name="date" type="date" required value="${esc(r.date)}"></div><div class="field"><label>Başlangıç – Bitiş *</label><div style="display:flex;gap:7px"><input name="start" type="time" required value="${esc(r.start)}"><input name="end" type="time" required value="${esc(r.end)}"></div></div><div class="field"><label>Anlaşma tutarı (₺)</label><input name="total" type="number" min="0" step="0.01" value="${r.total}" oninput="updateBalancePreview()"></div><div class="field"><label>İlk kapora (₺)</label><input name="deposit" type="number" min="0" step="0.01" value="${r.deposit}" oninput="updateBalancePreview()" ${id?'readonly':''}></div><div class="full summary" id="balancePreview">Kalan: ${money(balance(r))}</div><div class="field full"><label>Açıklama / Alan / Balon rengi / Masa örtüsü / Özel istekler</label><textarea name="notes" placeholder="Örn. Sağ bahçe, pembe-beyaz balon, 10 kişilik masa...">${esc(r.notes)}</textarea></div></div><div class="modalfooter"><button type="button" class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn" type="submit">${id?'Değişiklikleri kaydet':'Rezervasyonu kaydet'}</button></div></form>`;modal(id?'Rezervasyonu düzenle':'Yeni rezervasyon',content)}
function updateBalancePreview(){let f=document.getElementById('reservationForm');let existing=db.reservations.find(x=>x.id===f.dataset.id);let paid=existing?Number(existing.paid||0):0;document.getElementById('balancePreview').textContent='Kalan: '+money(Math.max(0,Number(f.total.value)-Number(f.deposit.value)-paid))}
function saveReservation(e,id){e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(d.end<=d.start){alert('Bitiş saati başlangıçtan sonra olmalı.');return}let total=Number(d.total),deposit=Number(d.deposit);let old=db.reservations.find(x=>x.id===id),paid=old?Number(old.paid||0):0;if(total<deposit+paid){alert('Toplam tutar, tahsil edilen ödemelerden az olamaz.');return}let obj={...old,...d,id:id||uid(),total,deposit,paid,payments:old?.payments||[],createdAt:old?.createdAt||new Date().toISOString()};if(!old&&deposit>0)obj.payments.push({id:uid(),date:localDate(new Date()),amount:deposit,method:'Kapora',note:'İlk kapora'});if(old){db.reservations=db.reservations.map(x=>x.id===id?obj:x)}else db.reservations.push(obj);save();closeModal();render();toast('Rezervasyon kaydedildi')}
function showReservation(id){let r=db.reservations.find(x=>x.id===id);if(!r)return;let tel=r.phone.replace(/\D/g,'');if(tel.startsWith('0'))tel='90'+tel.slice(1);else if(tel.length===10)tel='90'+tel;let content=`<div class="notice"><b>${esc(r.type)}</b> • ${esc(r.status)}<br>${dateTR(r.date)} • ${esc(r.start)}–${esc(r.end)}</div><p><b>Müşteri:</b> ${esc(r.name)}<br><b>Telefon / WhatsApp:</b> ${tel?`<a href="https://wa.me/${tel}" target="_blank" rel="noopener noreferrer" style="color:var(--wine);font-weight:800;text-decoration:underline">${esc(r.phone)} ↗ WhatsApp</a>`:esc(r.phone)}</p><p><b>Açıklama:</b><br>${esc(r.notes||'Açıklama eklenmemiş.').replace(/\n/g,'<br>')}</p><div class="cards" style="grid-template-columns:repeat(3,1fr)">${card('₺','Toplam',money(r.total))}${card('✓','Tahsil',money(totalPaid(r)))}${card('◷','Kalan',money(balance(r)))}</div><h3>Ödeme geçmişi</h3>${(r.payments||[]).map(p=>`<div style="border-bottom:1px solid var(--line);padding:7px">${dateTR(p.date)} • ${money(p.amount)} • ${esc(p.method)} ${p.note?'• '+esc(p.note):''}</div>`).join('')||'<p class="muted">Ödeme yok.</p>'}<div class="toolbar" style="margin-top:16px"><button class="btn sm" onclick="addPayment('${id}')">＋ Ödeme ekle</button><button class="btn secondary sm" onclick="openReservation('${id}')">Düzenle</button>${tel?`<a class="btn secondary sm" style="text-decoration:none" href="https://wa.me/${tel}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`:''}<button class="btn danger sm" onclick="removeReservation('${id}')">Sil</button></div>`;modal('Rezervasyon detayı',content)}
function addPayment(id){let r=db.reservations.find(x=>x.id===id);modal('Ödeme ekle',`<div class="notice">${esc(r.name)} • Kalan: ${money(balance(r))}</div><form onsubmit="savePayment(event,'${id}')"><div class="formgrid"><div class="field"><label>Ödeme tarihi</label><input name="date" type="date" required value="${localDate(new Date())}"></div><div class="field"><label>Ödeme tutarı (₺)</label><input name="amount" type="number" min="0.01" step="0.01" max="${balance(r)}" required></div><div class="field"><label>Ödeme yöntemi</label><select name="method"><option>Nakit</option><option>Kart</option><option>Havale/EFT</option></select></div><div class="field"><label>Not</label><input name="note" placeholder="İsteğe bağlı"></div></div><div class="modalfooter"><button type="button" class="btn secondary" onclick="closeModal()">İptal</button><button class="btn" type="submit">Ödemeyi kaydet</button></div></form>`)}
function savePayment(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),r=db.reservations.find(x=>x.id===id),a=Number(d.amount);if(a<=0||a>balance(r)){alert('Geçerli bir ödeme tutarı girin.');return}r.paid=Number(r.paid||0)+a;r.payments??=[];r.payments.push({...d,id:uid(),amount:a});save();closeModal();render();toast('Ödeme kaydedildi')}
function removeReservation(id){if(!confirm('Bu rezervasyonu kalıcı olarak silmek istiyor musunuz?'))return;db.reservations=db.reservations.filter(x=>x.id!==id);save();closeModal();render();toast('Rezervasyon silindi')}
function cafe(){let today=localDate(new Date()),rows=[...db.cafe].sort((a,b)=>b.date.localeCompare(a.date)),sum=rows.filter(x=>x.date===today).reduce((s,x)=>s+Number(x.cash)+Number(x.card)+Number(x.transfer),0);return `<div class="cards">${card('☕','Bugünkü kafe cirosu',money(sum))}${card('▥','Bugünkü giriş sayısı',rows.filter(x=>x.date===today).length)}${card('₺','Toplam kayıtlı ciro',money(rows.reduce((s,x)=>s+Number(x.cash)+Number(x.card)+Number(x.transfer),0)))}${card('◷','Bugün',dateTR(today))}</div><div class="panel"><h2>Yeni kafe ciro kaydı</h2><form onsubmit="saveCafe(event)"><div class="formgrid"><div class="field"><label>Tarih</label><input type="date" name="date" required value="${today}"></div><div class="field"><label>Nakit satış (₺)</label><input type="number" name="cash" min="0" step="0.01" value="0" required></div><div class="field"><label>Kart satış (₺)</label><input type="number" name="card" min="0" step="0.01" value="0" required></div><div class="field"><label>Havale / EFT (₺)</label><input type="number" name="transfer" min="0" step="0.01" value="0" required></div><div class="field full"><label>Not</label><input name="note" placeholder="Örn. Akşam vardiyası"></div></div><div style="margin-top:15px"><button class="btn" type="submit">Ciroyu kaydet</button></div></form></div><div class="panel"><h2>Kafe ciro geçmişi</h2>${rows.length?`<div class="tablewrap"><table><tr><th>Tarih</th><th>Nakit</th><th>Kart</th><th>Havale</th><th>Toplam</th><th>İşlem</th></tr>${rows.map(x=>`<tr><td>${dateTR(x.date)}<br><span class="muted">${esc(x.note)}</span></td><td>${money(x.cash)}</td><td>${money(x.card)}</td><td>${money(x.transfer)}</td><td><b>${money(Number(x.cash)+Number(x.card)+Number(x.transfer))}</b></td><td><button class="btn danger sm" onclick="deleteCafe('${x.id}')">Sil</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Henüz ciro kaydı yok.</div>'}</div>`}
function saveCafe(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(let k of ['cash','card','transfer'])d[k]=Number(d[k]);db.cafe.push({...d,id:uid()});save();render();toast('Kafe cirosu kaydedildi')}
function deleteCafe(id){if(!confirm('Bu ciro kaydı silinsin mi?'))return;db.cafe=db.cafe.filter(x=>x.id!==id);save();render()}
function reports(){let rs=db.reservations.filter(active),total=rs.reduce((s,r)=>s+Number(r.total),0),paid=rs.reduce((s,r)=>s+totalPaid(r),0),cafeTotal=db.cafe.reduce((s,r)=>s+Number(r.cash)+Number(r.card)+Number(r.transfer),0),expenses=db.expenses.reduce((s,r)=>s+Number(r.amount),0);return `<div class="notice">Raporlar, uygulamaya kaydettiğiniz tüm tarihlerdeki verileri gösterir. Rezervasyon tutarı ile tahsilat birbirinden farklıdır.</div><div class="cards">${card('▥','Aktif anlaşma toplamı',money(total))}${card('✓','Rezervasyon tahsilatı',money(paid))}${card('☕','Kafe cirosu',money(cafeTotal))}${card('◷','Bekleyen bakiye',money(total-paid))}</div><div class="cards">${card('−','Kayıtlı giderler',money(expenses))}${card('₺','Tahsilat + kafe − gider',money(paid+cafeTotal-expenses))}${card('▦','Aktif rezervasyonlar',rs.length)}${card('✕','İptal edilen',db.reservations.length-rs.length)}</div><div class="panel"><h2>Gider kaydı ekle</h2><form onsubmit="saveExpense(event)"><div class="formgrid"><div class="field"><label>Tarih</label><input type="date" name="date" required value="${localDate(new Date())}"></div><div class="field"><label>Kategori</label><select name="category">${['Personel','Ürün alımı','Elektrik / Su','Temizlik','Bakım','Diğer'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Tutar (₺)</label><input type="number" name="amount" required min="0.01" step="0.01"></div><div class="field"><label>Açıklama</label><input name="note" placeholder="Gider detayı"></div></div><div style="margin-top:15px"><button class="btn">Gider ekle</button></div></form></div><div class="panel"><h2>Gider geçmişi</h2>${db.expenses.length?`<div class="tablewrap"><table><tr><th>Tarih</th><th>Kategori</th><th>Açıklama</th><th>Tutar</th><th></th></tr>${[...db.expenses].reverse().map(x=>`<tr><td>${dateTR(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td>${money(x.amount)}</td><td><button class="btn danger sm" onclick="deleteExpense('${x.id}')">Sil</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Henüz gider kaydı yok.</div>'}</div>`}
function saveExpense(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.expenses.push({...d,id:uid(),amount:Number(d.amount)});save();render();toast('Gider kaydedildi')}
function deleteExpense(id){if(!confirm('Gider silinsin mi?'))return;db.expenses=db.expenses.filter(x=>x.id!==id);save();render()}
function settings(){return `<div class="panel"><h2>Veri yedekleme</h2><div class="notice">Bu bir yerel prototiptir. Veriler bu tarayıcının depolama alanındadır; başka telefonlara otomatik aktarılmaz. Tarayıcı verileri silinirse kayıtlar kaybolabilir. Düzenli yedek alın.</div><div class="toolbar"><button class="btn" onclick="exportJSON()">↓ JSON yedeği indir</button><button class="btn secondary" onclick="exportCSV()">↓ Rezervasyon CSV indir</button><label class="btn secondary" style="cursor:pointer">↑ Yedekten geri yükle<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div></div><div class="panel"><h2>Çalışan hesapları ve ortak kullanım</h2><p>Bu deneme sürümünde gerçek kullanıcı hesabı veya çevrimiçi eşitleme bulunmuyor. Bir sonraki sürümde yönetici ve çalışan girişleri, yetkilendirme, güvenli veritabanı ve işlem geçmişi kurulacak.</p></div><div class="panel"><h2>Uygulama bilgileri</h2><p><b>Uygulama:</b> Plato Vow<br><b>Sürüm:</b> 1.0 • Yerel prototip<br><b>Rezervasyon:</b> ${db.reservations.length}<br><b>Kafe kaydı:</b> ${db.cafe.length}</p><button class="btn danger sm" onclick="resetData()">Tüm deneme verilerini sil</button></div>`}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('plato-vow-yedek-'+localDate(new Date())+'.json',JSON.stringify(db,null,2),'application/json');toast('Yedek indirildi')}
function exportCSV(){let cols=['name','phone','type','date','start','end','status','total','deposit','paid','notes'],lines=[cols.join(';'),...db.reservations.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))];download('plato-vow-rezervasyonlar.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');toast('CSV indirildi')}
function importJSON(e){let file=e.target.files[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.reservations)||!Array.isArray(x.cafe)||!Array.isArray(x.expenses))throw Error('Geçersiz dosya');if(!confirm('Mevcut veriler yedek dosyasındaki verilerle değiştirilsin mi?'))return;db=x;save();render();toast('Yedek yüklendi')}catch(err){alert('Yedek dosyası okunamadı.')}};rd.readAsText(file)}
function resetData(){if(prompt('Tüm verileri silmek için SİL yazın:')!=='SİL')return;db={reservations:[],cafe:[],expenses:[]};save();render();toast('Veriler silindi')}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}

</script><style>#pvAuth{position:fixed;inset:0;z-index:999999;background:#f8f5f5;display:flex;align-items:center;justify-content:center;padding:20px}#pvAuth .authcard{width:min(420px,100%);padding:30px;border-radius:22px;background:white;box-shadow:0 12px 60px #512d3920}#pvAuth h1{color:#512d39;font-family:Georgia,serif}#pvAuth input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #dfd1d6;border-radius:9px}#pvAuth button{width:100%;background:#512d39;color:white;padding:14px;border:0;border-radius:10px}#pvAuth p{color:#a03b55}</style><div id="pvAuth"><div class="authcard"><h1>PLATO VOW</h1><h3>Yönetim Paneli</h3><form id="pvLogin"><label>E-posta<input type="email" id="pvEmail" required autocomplete="username"></label><label>Şifre<input type="password" id="pvPass" required autocomplete="current-password"></label><button>Giriş Yap</button></form><p id="pvError"></p></div></div><script src="/cloud.js"></script></body></html>
